    <linearGradient id="sdrCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111622" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b0e17" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sdrAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="sdrGlowCenter" cx="50%" cy="45%" r="50%">
